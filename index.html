<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>逃离校园</title>
    <link rel="stylesheet" href="styles.css?v=20260608-keyboard-boost-1" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-stage is-start-screen" id="gameStage" aria-label="逃离校园游戏区域">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div class="start-screen" id="startScreen">
          <div class="start-title-img" id="startTitleImg" role="img" aria-label="逃离学校"></div>
          <button class="start-btn" id="startGameBtn" type="button" aria-label="开始游戏">
            <span id="startGameImg" aria-hidden="true"></span>
          </button>
          <button class="start-sound-btn" id="startSoundBtn" type="button" aria-label="关闭声音">
            <span id="startSoundImg" aria-hidden="true"></span>
          </button>
          <div class="start-loading hidden" id="startLoading" role="status" aria-live="polite">
            <span></span>
            <strong>加载中...</strong>
          </div>
          <div class="start-story hidden" id="startStory" aria-hidden="true">
            <button class="start-story-skip" id="startStorySkipBtn" type="button">跳过</button>
            <div class="start-story-board" id="startStoryBoard"></div>
          </div>
        </div>

        <div class="game-ui">
          <div class="hud">
            <div>
              <span id="levelName">宿舍</span>
              <span id="levelProgress">1/2</span>
            </div>
            <div id="statusText">躲开宿舍阿姨的目光，冲向出口</div>
            <div id="playerStats">生命 100</div>
          </div>
          <button class="sound-toggle" id="soundToggleBtn" type="button" aria-label="关闭声音">声音 开</button>
          <button class="home-toggle" id="homeToggleBtn" type="button" aria-label="返回主界面">返回主界面</button>

          <div class="overlay hidden" id="messageOverlay">
            <div class="failure-panel">
              <h1 id="messageTitle">逃离校园</h1>
              <img class="failure-character" alt="" aria-hidden="true" />
              <p id="messageText">准备开始</p>
              <div class="overlay-actions">
                <button id="restartLevelBtn" type="button">重试本关</button>
                <button id="restartGameBtn" type="button">返回主界面</button>
              </div>
            </div>
          </div>

          <div class="controls" aria-label="触屏控制">
            <div class="dpad">
              <button class="control-btn up" data-dir="up" type="button" aria-label="向上">▲</button>
              <button class="control-btn left" data-dir="left" type="button" aria-label="向左">◀</button>
              <button class="control-btn down" data-dir="down" type="button" aria-label="向下">▼</button>
              <button class="control-btn right" data-dir="right" type="button" aria-label="向右">▶</button>
            </div>
            <button class="speed-btn is-hidden" id="speedBtn" type="button" aria-label="加速" aria-hidden="true" style="display: none;">加速</button>
            <button class="attack-btn is-hidden" id="attackBtn" type="button" aria-label="攻击" aria-hidden="true" style="display: none;">攻击</button>
          </div>
        </div>
      </section>
      <div class="rotate-tip">请将手机横屏游玩</div>
    </main>

    <script type="module" src="src/main.js?v=20260608-keyboard-boost-1"></script>
  </body>
</html>
